[project]
name = "research-paper-assistant"
version = "1.0.0"
description = "Two-agent research paper assistant: RAG Q&A + explainable similar-paper ranking"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2.11",
    "langchain-groq>=1.1",
    "langchain-google-genai>=4.0",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.0",
    "langchain-huggingface>=1.2",
    "sentence-transformers>=5.0",
    "faiss-cpu>=1.9",
    "pypdf>=5.0",
    "arxiv>=2.1",
    "requests>=2.31",
    "pandas>=2.0",
]

[dependency-groups]
dev = ["jupyterlab>=4", "ipywidgets>=8"]
